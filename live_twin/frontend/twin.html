    function setAgentState(on, label) {
      agentToggle.classList.toggle("is-selected", on);
      agentToggle.setAttribute("aria-pressed", String(on));
      agentToggle.textContent = label ?? (on ? "Listening" : "Talk");
    }

    async function startAgent() {
      if (!AGENT_ID) {
        console.warn("[twin] no agent id — open with ?agent=<agent_id>. See docs/VOICE_AGENT.md");
        setAgentState(false, "No agent");
        return;
      }
      agentBusy = true;
      setAgentState(false, "Connecting…");
      try {
        // Asked for explicitly rather than on page load: a page that grabs the
        // microphone unprompted is not one people trust.
        await navigator.mediaDevices.getUserMedia({ audio: true });

        const { Conversation } = await import("https://cdn.jsdelivr.net/npm/@elevenlabs/client@latest/+esm");
        conversation = await Conversation.startSession({
          agentId: AGENT_ID,
          clientTools: agentTools(),
          onConnect: () => setAgentState(true, "Listening"),
          onDisconnect: () => { conversation = null; setAgentState(false); },
          onError: (err) => {
            console.error("[twin] agent error", err);
            conversation = null;
            setAgentState(false, "Talk");
          },
          // Two voices talking over each other is worse than one: the
          // pre-rendered cues stand down while the agent has something to say.
          onModeChange: ({ mode }) => {
            agentSpeaking = mode === "speaking";
            setAgentState(true, mode === "speaking" ? "Speaking" : "Listening");
          },
        });
      } catch (err) {
        console.error("[twin] could not start the agent", err);
        conversation = null;
        setAgentState(false, "Mic blocked");
      } finally {
        agentBusy = false;
      }
    }

    async function stopAgent() {
      const session = conversation;
      conversation = null;
      agentSpeaking = false;
      setAgentState(false);
      if (session) await session.endSession().catch(() => {});
    }

    agentToggle.addEventListener("click", () => {
      if (agentBusy) return;
      if (conversation) stopAgent(); else startAgent();
    });

    if (!AGENT_ID) agentToggle.disabled = true;

    window.addEventListener("pagehide", () => { stopAgent(); });

    // Zero-click: the coach greets the patient itself instead of waiting for
    // a Talk press, since the hand they'd click with may be the impaired one.
    // Most browsers allow getUserMedia to run without a click (the mic prompt
    // itself isn't gesture-gated); if a browser blocks it anyway, startAgent's
    // existing catch leaves the Talk button as a one-tap fallback.
    if (AGENT_ID) startAgent();

    // --- Guided exercise sessions -------------------------------------------
    //
    // Each exercise is data: which pad drives it, which joint angle proves it
    // happened, and the thresholds a rep has to cross. One engine runs any of
    // them, so adding an exercise is adding an entry here.
    //
    // `restBelow` / `repAbove` are deliberately far apart. A single threshold
    // would count several reps as a trembling arm crossed back and forth over
    // it; requiring the angle to reach the top and come all the way back means
    // one rep is one real movement.
    //
    // Demo poses are in twin space (x right, y up, z toward the viewer), with
    // the shoulder at the origin.
    const EXERCISES = [
      {
        id: "elbow_flexion", intro: "intro_elbow_flexion", name: "Elbow flexion", muscle: "Bicep",
        motion: "raise", target: "bicep", cue: "motion_raise",
        metric: "elbowFlex", restBelow: 35, repAbove: 70,
        reps: 8, bpm: 50, verified: true,
        demo: { rest: { e: [0.15, -1.20, 0], w: [0.25, -2.20, 0] },
                peak: { e: [0.15, -1.20, 0], w: [0.30, -1.30, 0.95] } },
      },
      {
        id: "elbow_extension", intro: "intro_elbow_extension", name: "Elbow extension", muscle: "Tricep",
        motion: "lower", target: "tricep", cue: "motion_lower",
        // Inverted sense: the movement being trained is the arm STRAIGHTENING,
        // so the rep completes as the angle falls, not as it rises.
        metric: "elbowFlex", restBelow: 35, repAbove: 70, inverted: true,
        reps: 8, bpm: 50, verified: true,
        demo: { rest: { e: [0.15, -1.20, 0], w: [0.30, -1.30, 0.95] },
                peak: { e: [0.15, -1.20, 0], w: [0.25, -2.20, 0] } },
      },
      {
        id: "shoulder_flexion", intro: "intro_shoulder_flexion", name: "Forward reach", muscle: "Front delt",
        motion: "push_forward", target: "frontDelt", cue: "motion_push_forward",
        metric: "shoulderFlex", restBelow: 20, repAbove: 60,
        reps: 6, bpm: 40, verified: true,
        demo: { rest: { e: [0.15, -1.20, 0], w: [0.25, -2.20, 0] },
                peak: { e: [0.15, -0.25, 1.15], w: [0.25, -0.15, 2.15] } },
      },
      {
        id: "shoulder_extension", intro: "intro_shoulder_extension", name: "Pull back", muscle: "Rear delt",
        motion: "pull_back", target: "rearDelt", cue: "motion_pull_back",
        metric: "shoulderFlex", restBelow: -25, repAbove: -5, fromBelow: true,
        reps: 6, bpm: 40, verified: true,
        demo: { rest: { e: [0.15, -1.20, 0], w: [0.25, -2.20, 0] },
                peak: { e: [0.15, -1.05, -0.6], w: [0.25, -1.85, -1.2] } },
      },
      {
        id: "grip", intro: "intro_grip", name: "Grip", muscle: "Wrist flexor",
        motion: "grip", target: "forearmFlexor", cue: "motion_grip",
        // No finger landmarks exist in MediaPipe Pose, so there is nothing to
        // measure. Counted on the clock and labelled unverified rather than
        // presented as if it were observed.
        metric: null, verified: false,
        reps: 8, bpm: 45,
        demo: null,
      },
    ];

    const DEMO_CYCLES = 2;
    const DEMO_CYCLE_MS = 2600;
    const BEATS_PER_REP = 4;   // one bar per repetition
    // How long a set can stall before the coach offers a reason why.
    const STALL_HINT_MS = 9000;

    const stepsList = document.querySelector("#steps");
    const flowStep = document.querySelector("#flow-step");
    const flowInstruction = document.querySelector("#flow-instruction");
    const flowChoices = document.querySelector("#flow-choices");
    const flowCount = document.querySelector("#flow-count");
    const flowBack = document.querySelector("#flow-back");
    const flowNext = document.querySelector("#flow-next");

    let session = null;   // null when idle

    function degrees(radians) {
      return radians * 180 / Math.PI;
    }

    // Shoulder sits at the origin, so the elbow vector is the upper arm.
    // Twin space: +x right, +y up, +z toward the viewer, so "hanging" is -y and
    // "reaching toward the camera" is +z.
    function jointAngles(elbow, wrist) {
      const fore = wrist.clone().sub(elbow);
      const toShoulder = elbow.clone().negate();
      const included = degrees(toShoulder.angleTo(fore));
      return {
        elbowFlex: 180 - included,
        shoulderFlex: degrees(Math.atan2(elbow.z, -elbow.y)),
        shoulderAbd: degrees(Math.atan2(elbow.x, -elbow.y)),
      };
    }

    function fireMotion(motion) {
      if (socket?.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "select_motion", motion }));
    }

    function startSession(exercise) {
      if (session) stopSession({ silent: true });

      session = {
        exercise,
        phase: "watch",
        reps: 0,
        startedAt: performance.now(),
        // Rep detection needs the angle to reach the top before a return can
        // count, so a session never opens already half-way through a rep.
        armed: false,
        hinted: false,
        lastRepAt: null,
        lastBeat: -1,
      };

      // What this exercise trains and the form mistake it invites, spoken over
      // the demonstration — people stay with rehab they understand.
      speak(exercise.intro, { force: true });
      paintSession();

      // Pace at the exercise's own tempo. Left running through the demo so the
      // rhythm is established before the patient is asked to move to it.
      tempoInput.value = exercise.bpm;
      tempoReadout.textContent = exercise.bpm;
      metronomeBpm = exercise.bpm;
      if (!metronomeOn) setMetronome(true);
    }

    function stopSession(options) {
      const settings = options || {};
      if (!session) return;
      if (!settings.silent) speak("stopping", { force: true });
      session = null;
      setMetronome(false);
      paintSession();
    }

    // --- Flow ---------------------------------------------------------------
    //
    // One thing on screen at a time, one obvious next action, and the model
    // doing the explaining. Pad placement lives here because it was previously
    // only reachable over HTTP — there was no way for a person to actually set
    // the system up.

    const FLOW_STEPS = ["arm", "pads", "exercise", "session"];

    const flow = {
      step: 0,
      padIndex: 0,
      arm: null,        // chosen side; null until picked, so Next stays disabled
      exercise: null,
    };

    function stepName() {
      return FLOW_STEPS[flow.step];
    }

    function renderSteps() {
      stepsList.replaceChildren(...FLOW_STEPS.map((_, index) => {
        const dot = document.createElement("li");
        if (index < flow.step) dot.className = "is-done";
        else if (index === flow.step) dot.className = "is-current";
        return dot;
      }));
    }

    function choiceButton(name, sub, selected, unverified, onPick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice"
        + (selected ? " is-selected" : "")
        + (unverified ? " choice-unverified" : "");

      const label = document.createElement("span");
      label.className = "choice-name";
      label.textContent = name;
      button.append(label);

      if (sub) {
        const detail = document.createElement("span");
        detail.className = "choice-sub";
        detail.textContent = sub;
        button.append(detail);
      }
      button.addEventListener("click", onPick);
      return button;
    }

    const STEP_TITLE = { arm: "Set up", pads: "Place the pads", exercise: "Choose", session: "Session" };

    function paintFlow() {
      renderSteps();
      flowStep.textContent = STEP_TITLE[stepName()];
      flowChoices.replaceChildren();
      flowCount.hidden = true;
      flowBack.hidden = flow.step === 0;
      flowNext.classList.remove("is-stop");
      flowNext.disabled = false;

      const step = stepName();

      if (step === "arm") {
        flowInstruction.textContent = "Which arm are we working on?";
        for (const side of ["left", "right"]) {
          flowChoices.append(choiceButton(
            side === "left" ? "Left arm" : "Right arm", null,
            flow.arm === side, false,
            () => { flow.arm = side; applySideSelection(side); paintFlow(); },
          ));
        }
        flowNext.textContent = "Continue";
        // Nothing to advance to until a side is chosen: the pad walkthrough
        // and the meshes both depend on knowing which arm this is.
        flowNext.disabled = flow.arm === null;
        return;
      }

      if (step === "pads") {
        const pad = PAD_ORDER[flow.padIndex];
        flowInstruction.textContent =
          `${PAD_LABEL[pad]} — ${voiceManifest?.[PAD_CUE[pad]]?.text ?? "place the pad on the highlighted muscle"}`;
        flowCount.hidden = false;
        flowCount.textContent = `${flow.padIndex + 1} / ${PAD_ORDER.length}`;
        flowNext.textContent = flow.padIndex === PAD_ORDER.length - 1 ? "All placed" : "Placed";
        return;
      }

      if (step === "exercise") {
        flowInstruction.textContent = "Choose an exercise.";
        for (const exercise of EXERCISES) {
          flowChoices.append(choiceButton(
            exercise.name, exercise.muscle,
            flow.exercise === exercise, !exercise.verified,
            () => { flow.exercise = exercise; paintFlow(); },
          ));
        }
        flowNext.textContent = "Start";
        flowNext.disabled = flow.exercise === null;
        return;
      }

      // session
      if (!session) {
        flowInstruction.textContent = "Session finished.";
        flowNext.textContent = "Again";
        return;
      }
      const phaseText = {
        watch: "Watch the model.",
        go: "Your turn — follow the pace.",
        done: "Session complete. Well done.",
      };
      flowInstruction.textContent = `${session.exercise.name} — ${phaseText[session.phase] ?? ""}`;
      flowCount.hidden = false;
      flowCount.textContent = `${session.reps} / ${session.exercise.reps}`;
      flowNext.textContent = "Stop";
      flowNext.classList.add("is-stop");
    }

    // Kept as the name the session engine already calls.
    function paintSession() {
      if (stepName() === "session") paintFlow();
    }

    function enterStep(index) {
      flow.step = Math.max(0, Math.min(FLOW_STEPS.length - 1, index));
      const step = stepName();

      if (step === "arm") {
        setPadsVisible(false);
        highlightPad(null);
      } else if (step === "pads") {
        setPadsVisible(true);
        speak("setup_start", { force: true });
        highlightPad(PAD_ORDER[flow.padIndex]);
        // Let the intro land before naming the first pad.
        window.setTimeout(() => speak(PAD_CUE[PAD_ORDER[flow.padIndex]], { force: true }), 2400);
      } else if (step === "exercise") {
        highlightPad(null);
        setPadsVisible(true);
        speak("choose_exercise", { force: true });
      }
      paintFlow();

    }

    flowNext.addEventListener("click", () => {
      const step = stepName();

      if (step === "arm") {
        flow.padIndex = 0;
        enterStep(flow.step + 1);
        return;
      }

      if (step === "pads") {
        if (flow.padIndex < PAD_ORDER.length - 1) {
          flow.padIndex += 1;
          highlightPad(PAD_ORDER[flow.padIndex]);
          speak(PAD_CUE[PAD_ORDER[flow.padIndex]], { force: true });
          paintFlow();
        } else {
          speak("pad_done", { force: true });
          enterStep(flow.step + 1);
        }
        return;
      }

      if (step === "exercise") {
        if (!flow.exercise) return;
        enterStep(flow.step + 1);
        startSession(flow.exercise);
        paintFlow();
        return;
      }

      // session: this button is Stop while running, Again once finished
      if (session) {
        stopSession();
      } else {
        flow.exercise = null;
        enterStep(FLOW_STEPS.indexOf("exercise"));
      }
    });

    flowBack.addEventListener("click", () => {
      if (session) stopSession({ silent: true });
      if (stepName() === "pads" && flow.padIndex > 0) {
        flow.padIndex -= 1;
        highlightPad(PAD_ORDER[flow.padIndex]);
        paintFlow();
        return;
      }
      enterStep(flow.step - 1);
    });

    // Held while choosing an arm and placing pads. Returns null once a session
    // starts, at which point the model goes back to following the real arm.
    function referencePose() {
      const step = stepName();
      return (step === "arm" || step === "pads") ? REFERENCE_POSE : null;
    }

    // Demo pose for the current moment, or null when not demonstrating. Returns
    // twin-space positions so the same rig that renders live pose renders this.
    function demoPose() {
      if (!session || session.phase !== "watch") return null;
      const spec = session.exercise.demo;
      const elapsed = performance.now() - session.startedAt;

      if (!spec || elapsed > DEMO_CYCLES * DEMO_CYCLE_MS) return null;

      // Ease in and out so the demonstration reads as a movement rather than a
      // slider being dragged.
      const phase = (elapsed % DEMO_CYCLE_MS) / DEMO_CYCLE_MS;
      const t = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
      const lerp = (a, b) => a.map((v, i) => v + (b[i] - v) * t);
      return {
        elbow: new THREE.Vector3(...lerp(spec.rest.e, spec.peak.e)),
        wrist: new THREE.Vector3(...lerp(spec.rest.w, spec.peak.w)),
      };
    }

    // Said after a rep, not on every one. Constant praise stops carrying
    // information; these are spaced so that hearing one still means something.
    function encouragementFor(done, total) {
      if (done === Math.ceil(total / 2)) return "enc_halfway";
      if (done === total - 2) return "enc_almost";
      if (done === 3) return "enc_good_form";
      if (done === 6) return "enc_keep_going";
      return null;
    }

    function completeRep() {
      session.reps += 1;
      session.lastRepAt = performance.now();
      session.hinted = false;
      const remaining = session.exercise.reps - session.reps;

      if (session.reps <= 10) speak(`count_${session.reps}`, { force: true });
      paintSession();

      if (remaining === 0) {
        session.phase = "done";
        speak("enc_strong_finish", { force: true });
        window.setTimeout(() => speak("complete", { force: true }), 1400);
        paintSession();
        window.setTimeout(() => stopSession({ silent: true }), 4200);
        return;
      }

      if (remaining === 1) {
        window.setTimeout(() => speak("last_one", { force: true }), 800);
        return;
      }

      const cue = encouragementFor(session.reps, session.exercise.reps);
      // Delayed past the count so the two are not spoken over each other.
      if (cue) window.setTimeout(() => speak(cue, { force: true }), 900);
    }

    // Called once per rendered frame with the pose currently on screen.
    function updateSession(elbow, wrist) {
      if (!session) return;
      const exercise = session.exercise;
      const elapsed = performance.now() - session.startedAt;

      if (session.phase === "watch") {
        const demoing = exercise.demo && elapsed < DEMO_CYCLES * DEMO_CYCLE_MS;
        if (demoing) return;
        session.phase = "go";
        session.startedAt = performance.now();
        speak("your_turn", { force: true });
        // The movement cue lands after the handover, so the two do not overlap.
        window.setTimeout(() => speak(exercise.cue, { force: true }), 1200);
        paintSession();
        return;
      }
      if (session.phase !== "go") return;

      // Unmeasurable exercises (grip) are paced rather than observed: one rep
      // per bar of the metronome, so the count reflects effort attempted, not
      // movement confirmed.
      if (!exercise.metric) {
        const beat = Math.floor((performance.now() - session.startedAt)
                                / (60000 / exercise.bpm * BEATS_PER_REP));
        if (beat > session.lastBeat) {
          session.lastBeat = beat;
          if (beat > 0) completeRep();
          fireMotion(exercise.motion);
        }
        return;
      }

      const value = jointAngles(elbow, wrist)[exercise.metric];
      // `fromBelow` exercises move into negative angles (pulling behind the
      // body), and `inverted` ones complete as the angle falls rather than
      // rises. Normalising here keeps one comparison for all of them.
      const reached = exercise.fromBelow
        ? value > exercise.repAbove
        : (exercise.inverted ? value < exercise.restBelow : value > exercise.repAbove);
      const returned = exercise.fromBelow
        ? value < exercise.restBelow
        : (exercise.inverted ? value > exercise.repAbove : value < exercise.restBelow);

      if (!session.armed) {
        if (returned) {
          session.armed = true;
          // Assist the movement the patient is about to attempt.
          fireMotion(exercise.motion);
        }
        return;
      }
      if (reached) {
        session.armed = false;
        completeRep();
        return;
      }

      // Armed but nothing completing. Usually the movement is not reaching far
      // enough to count, which the patient has no way of knowing — silence here
      // reads as the system being broken rather than as feedback.
      const since = performance.now() - (session.lastRepAt ?? session.startedAt);
      if (since > STALL_HINT_MS && !session.hinted) {
        session.hinted = true;
        speak(value > exercise.restBelow ? "try_fuller" : "take_a_moment", { force: true });
      }
    }

    paintFlow();

    // Displayed anatomy follows the selected arm. An arm is chiral, so this has
    // to swap in the other side's real meshes rather than flip the current ones
    // — a mirrored right arm is a left arm, which would put the muscles on the
    // wrong faces.
    function setTrackedSide(side) {
      showArmMeshes(side).catch(() => {});
    }

    // Named for the arm the user picked, not the one the backend happened to
    // find, so "raise your left arm" can't tell them to move the wrong one.
    function armNoun() {
      return `your ${selectedSide} arm`;
    }

    function promptTextFor(status) {
      if (status === "no_person") return "Step into the camera view";
      if (status === "arm_not_visible") return `Get ${armNoun()} in the camera`;
      return `Waiting for ${armNoun()}`;
    }

    function cueKeyFor(status) {
      if (status === "no_person") return "no_person";
      if (status === "arm_not_visible") {
        return selectedSide === "left" ? "arm_left" : "arm_right";
      }
      return "arm_generic";
    }

    function showPrompt(status) {
      // Nothing to say about framing while someone is sticking electrodes to
      // their own arm — of course it is out of shot. Only ask for the arm back
      // once the model actually needs to follow it.
      if (referencePose()) {
        prompt.hidden = true;
        return;
      }
      const text = promptTextFor(status);
      promptText.textContent = text;
      // Spoken as well as shown: the person this prompt is for is mid-movement,
      // looking at their arm rather than at the screen.
      speak(cueKeyFor(status), { text: text });
      prompt.hidden = false;
    }

    function hidePrompt() {
      // Only on the transition back — "got you" on every frame would be absurd.
      if (!prompt.hidden) {
        speak("reacquired", { text: "Got you", force: true });
        lastCueKey = null;   // let the next loss re-announce itself immediately
      }
      prompt.hidden = true;
    }

    function hasAllJoints(set) {
      return Boolean(set)
        && isTriplet(set.shoulder)
        && isTriplet(set.elbow)
        && isTriplet(set.wrist);
    }

    function handlePose(message) {
      // Metric first (see ARM_SCALE above for why normalized z is unusable).
      // Falls back per-frame rather than per-session, so one frame without
      // world landmarks doesn't drop the twin to normalized permanently.
      const useMetric = hasAllJoints(message.world_landmarks);
      const landmarks = useMetric ? message.world_landmarks : message.landmarks;
      const scale = useMetric ? ARM_SCALE_METRIC : ARM_SCALE;

      if (!hasAllJoints(landmarks)) {
        // A pose message with no landmarks is the backend actively telling us
        // the arm isn't visible — distinct from no messages at all (stream
        // down), which the staleness check below handles.
        setTrackingState(lastPoseAt ? "hold" : "waiting");
        showPrompt(message.status);
        return;
      }

      const elbowPosition = shoulderRelative(landmarks.elbow, landmarks.shoulder, scale);
      const wristPosition = shoulderRelative(landmarks.wrist, landmarks.shoulder, scale);
      if (!poseIsUsable(elbowPosition, wristPosition)) {
        setTrackingState(lastPoseAt ? "hold" : "waiting");
        showPrompt(message.status);
        return;
      }

      targetElbow.copy(elbowPosition);
      targetWrist.copy(wristPosition);
      if (!hasPoseTarget) {
        // Snap the first sample: easing into it would fly the arm in from the
        // standby pose, which looks like a glitch rather than a transition.
        smoothedElbow.copy(elbowPosition);
        smoothedWrist.copy(wristPosition);
        hasPoseTarget = true;
      }

      lastPoseAt = performance.now();
      hidePrompt();
      setTrackingState("live");
    }

    function setConnectionState(state) {
      connectionPill.classList.remove("is-live", "is-hold");
      if (state === "live") {
        connectionPill.classList.add("is-live");
        connectionLabel.textContent = "Connected";
      } else if (state === "connecting") {
        connectionPill.classList.add("is-hold");
        connectionLabel.textContent = "Connecting";
      } else {
        connectionLabel.textContent = "Disconnected";
      }
    }

    function setArmedState(armed) {
      armedPill.classList.toggle("is-armed", armed);
      armedPill.classList.toggle("is-live", !armed);
      armedLabel.textContent = armed ? "Live current" : "Practice mode — no current";
    }

    function websocketUrl() {
      const override = new URLSearchParams(window.location.search).get("ws");
      if (override) return override;

      const secure = window.location.protocol === "https:";
      const scheme = secure ? "wss" : "ws";
      if (window.location.protocol === "file:") {
        return "ws://127.0.0.1:8000/ws";
      }

      // The repo does not serve frontend/ itself. When twin.html is opened from a
      // local static server, default to FastAPI's normal port rather than that server.
      const host = window.location.hostname || "127.0.0.1";
      const port = window.location.port && window.location.port !== "8000"
        ? "8000"
        : window.location.port;
      return `${scheme}://${host}${port ? `:${port}` : ""}/ws`;
    }

    const wsUrl = websocketUrl();
    endpoint.textContent = `WS ${wsUrl}`;
    endpoint.title = wsUrl;

    let socket = null;
    let reconnectAttempt = 0;
    let reconnectTimer = null;
    let allowReconnect = true;

    function sendSide() {
      if (socket?.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({
        type: "set_side",
        side: selectedSide,
      }));
    }

    function applySideSelection(side) {
      selectedSide = side;
      setTrackedSide(side);
      sideOptions.forEach((button) => {
        button.classList.toggle("is-selected", button.dataset.side === side);
      });
      sendSide();
    }

    sideOptions.forEach((button) => {
      button.addEventListener("click", () => applySideSelection(button.dataset.side));
    });

    function connect() {
      window.clearTimeout(reconnectTimer);
      setConnectionState("connecting");

      socket = new WebSocket(wsUrl);
      socket.addEventListener("open", () => {
        reconnectAttempt = 0;
        setConnectionState("live");
        // The side lives on the backend's single shared estimator, so it can
        // have been changed by another client (or reset by a restart) while we
        // were disconnected — re-assert this tab's choice on every connect.
        sendSide();
      });

      socket.addEventListener("message", (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }

        if (message.type === "ready") {
          setArmedState(Boolean(message.armed));
        } else if (message.type === "pose") {
          handlePose(message);
        } else if (message.type === "side") {
          // Ack only — the UI is the authority on which arm is selected, so a
          // disagreement here means our set_side did not land, not that we
          // should follow the server.
          if (message.side && message.side !== selectedSide) {
            console.warn(`[twin] backend reports side "${message.side}", UI selected "${selectedSide}"`);
          }
        } else if (message.type === "status") {
          handleStatus(message);
        }
      });

      socket.addEventListener("close", () => {
        setConnectionState("offline");
        if (lastPoseAt) setTrackingState("hold");
        if (!allowReconnect) return;
        reconnectAttempt += 1;
        const delay = Math.min(RECONNECT_MAX_MS, 500 * 2 ** Math.min(reconnectAttempt, 4));
        reconnectTimer = window.setTimeout(connect, delay);
      });

      socket.addEventListener("error", () => {
        socket.close();
      });
    }

    connect();

    window.setInterval(() => {
      if (lastPoseAt && performance.now() - lastPoseAt > TRACKING_STALE_MS) {
        setTrackingState("hold");
      }
    }, 250);

    let dragging = false;
    let previousPointerX = 0;
    let previousPointerY = 0;

    viewport.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousPointerX = event.clientX;
      previousPointerY = event.clientY;
      viewport.setPointerCapture(event.pointerId);
    });

    viewport.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      pointerTargetX += (event.clientX - previousPointerX) * 0.006;
      pointerTargetY += (event.clientY - previousPointerY) * 0.003;
      // Full turn: rear pads sit behind the arm, and the user should be able to
      // reach the same angles by hand that the pad walkthrough moves to.
      pointerTargetX = THREE.MathUtils.clamp(pointerTargetX, -Math.PI, Math.PI);
      pointerTargetY = THREE.MathUtils.clamp(pointerTargetY, -0.28, 0.28);
      previousPointerX = event.clientX;
      previousPointerY = event.clientY;
    });

    function endDrag(event) {
      dragging = false;
      if (viewport.hasPointerCapture(event.pointerId)) {
        viewport.releasePointerCapture(event.pointerId);
      }
    }

    viewport.addEventListener("pointerup", endDrag);
    viewport.addEventListener("pointercancel", endDrag);

    const resizeObserver = new ResizeObserver(() => {
      const width = Math.max(1, mount.clientWidth);
      const height = Math.max(1, mount.clientHeight);
      camera.aspect = width / height;
      // Framing is recomputed every frame, so the new aspect is picked up on the
      // next one — only the projection needs refreshing here.
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    });
    resizeObserver.observe(mount);

    const clock = new THREE.Clock();

    function animate() {
      // getDelta() must come first — it advances the clock; elapsedTime is then
      // read as a property so the clock is not stepped twice in one frame.
      const delta = Math.min(clock.getDelta(), MAX_FRAME_DELTA_S);
      const elapsed = clock.elapsedTime;

      // What the model should be doing right now, in priority order: holding
      // the reference pose for pad placement, demonstrating a movement, or
      // mirroring the live arm. Everything eases through the same smoothing, so
      // switching between them is a glide rather than a jump.
      const scripted = referencePose() || demoPose();
      const goalElbow = scripted ? scripted.elbow : targetElbow;
      const goalWrist = scripted ? scripted.wrist : targetWrist;

      if (scripted || hasPoseTarget) {
        const poseK = 1 - Math.exp(-POSE_SMOOTHING_RATE * delta);
        smoothedElbow.lerp(goalElbow, poseK);
        smoothedWrist.lerp(goalWrist, poseK);
        applyArmPose(smoothedElbow, smoothedWrist);
      }
      updateSession(smoothedElbow, smoothedWrist);

      const viewK = 1 - Math.exp(-VIEW_SMOOTHING_RATE * delta);
      presentationRig.rotation.y += (pointerTargetX - presentationRig.rotation.y) * viewK;
      presentationRig.rotation.x += (pointerTargetY - presentationRig.rotation.x) * viewK;

      // After the pose and the drag rotation are applied, so the measurement is
      // of the arm exactly as it will be drawn this frame. The camera itself
      // never moves — only its field of view changes.
      updateCameraFraming();

      if (targetCameraFov > camera.fov) {
        camera.fov = targetCameraFov;              // widen now, never clip
        camera.updateProjectionMatrix();
      } else if (camera.fov - targetCameraFov > 0.01) {
        camera.fov += (targetCameraFov - camera.fov) * (1 - Math.exp(-FOV_CONTRACT_RATE * delta));
        camera.updateProjectionMatrix();
      }

      activePads.forEach((pad) => {
        const targetName = padToTarget[pad];
        const pulse = 1.18 + Math.sin(elapsed * 9) * 0.34;
        targetMaterials.get(targetName).forEach((material) => {
          material.emissiveIntensity = pulse;
        });
      });

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // Loaded regardless of whether voice is on: the flow shows each cue's text
    // on screen, so the wording has to exist even in silence.
    loadVoiceManifest().then(paintFlow);



    window.addEventListener("pagehide", () => {
      allowReconnect = false;
      window.clearTimeout(reconnectTimer);
      socket?.close();
      resizeObserver.disconnect();
      renderer.dispose();
    });
  </script>
</body>
</html>
