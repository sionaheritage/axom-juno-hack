[project]
name = "axon"
version = "0.2.0"
description = "Axon landing site, Muscle Mapper, and Live Twin applications"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.4,<4",
    "mediapipe>=0.10.35",
    "numpy>=2.5.1",
    "openai>=2.48,<3",
    "opencv-python>=5.0.0.93",
    "pillow>=10.4",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "ultralytics>=8.2",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "ems_muscle_mapper/tests",
    "live_twin/tests",
    "tests",
]
